version: '3.8'

services:
  # Node.js API Server
  api-server:
    build:
      context: ../server
      dockerfile: ../infra/docker/Dockerfile.server
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_DIALECT=sqlite
      - DB_STORAGE=/app/data/skydocs.db
      - JWT_SECRET=change-this-in-production
    volumes:
      - ../server/data:/app/data
      - ../server/uploads:/app/uploads
    depends_on:
      - redis

  # React Frontend (dev mode)
  web-client:
    build:
      context: ../client
      dockerfile: ../infra/docker/Dockerfile.client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    volumes:
      - ../client/src:/app/src

  # AI Audio Service
  ai-audio:
    build:
      context: ../ai-audio-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}

  # AI Video Service
  ai-video:
    build:
      context: ../ai-video-service
      dockerfile: Dockerfile
    ports:
      - "8002:8002"

  # AI Text Service
  ai-text:
    build:
      context: ../ai-text-service
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}

  # Redis (Job Queue)
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
